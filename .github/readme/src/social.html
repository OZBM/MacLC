<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0b0d10}
.b{position:relative;width:1280px;height:640px;overflow:hidden;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#fff}
.b .art{position:absolute;inset:0;background:url(ART) 70% 50% / cover no-repeat}

.t{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:center;gap:26px}
.row img{width:120px;height:120px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
h1{font-size:96px;font-weight:700;letter-spacing:-2px;margin:0;line-height:1}
p{font-size:48px;font-weight:600;line-height:1.15;margin:32px 0 0;color:#ece8e2;max-width:700px;letter-spacing:-.3px}
.chips{display:flex;gap:12px;margin-top:36px}

.url{position:absolute;left:84px;bottom:44px;font-size:21px;color:#a9a39b;font-weight:500;letter-spacing:.2px}
</style></head><body><div class="b"><div class="art"></div><div class="shade"></div>

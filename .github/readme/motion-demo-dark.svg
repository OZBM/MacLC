<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-label="Animated illustration: a dot crossing the screen in visible steps at 24 frames per second, and smoothly at 120 frames per second." font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
@keyframes run { from { transform: translateX(0px); } to { transform: translateX(650px); } }
.dot { animation: run 2.5s infinite alternate; }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
<text x="24.0" y="36.0" font-size="20" fill="#f0f6fc" text-anchor="start" font-weight="600" >Smooth motion, illustrated</text>
<text x="24.0" y="58.0" font-size="13" fill="#9198a1" text-anchor="start" font-weight="400" >The same movement at both frame rates. Your browser draws the lower one as smoothly as it can.</text>
<text x="24.0" y="89.0" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="400" >24 fps, as filmed</text>
<line x1="250" y1="84" x2="900" y2="84" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
<circle class="dot" cx="250" cy="84" r="13" fill="#9198a1" stroke="#0d1117" stroke-width="2.5" style="animation-timing-function: steps(60, end);"/>
<text x="24.0" y="163.0" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="600" >Interpolated to 120 fps</text>
<line x1="250" y1="158" x2="900" y2="158" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
<circle class="dot" cx="250" cy="158" r="13" fill="#d95926" stroke="#0d1117" stroke-width="2.5" style="animation-timing-function: linear;"/>
<text x="24.0" y="214.0" font-size="11.5" fill="#6e7681" text-anchor="start" font-weight="400" >Illustration, not a capture: real interpolation computes the in-between frames from the video.</text>
</svg>
